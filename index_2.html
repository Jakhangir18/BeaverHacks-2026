<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sound Direction</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: #08090c;
    color: white;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.4s ease;
  }

  body.high {
    background: radial-gradient(circle at center, #2a0a0f 0%, #08090c 70%);
  }

  body.medium {
    background: radial-gradient(circle at center, #1a1606 0%, #08090c 70%);
  }

  .hud {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.1rem;
    width: min(420px, 92vw);
  }

  .title {
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    color: #7b7f8c;
    text-transform: uppercase;
  }

  #direction-canvas {
    width: 320px;
    height: 320px;
  }

  .direction-label {
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .angle {
    color: #8b91a1;
    font-size: 1rem;
  }

  .message-card {
    width: 100%;
    background: #11141b;
    border: 1px solid #1f2430;
    border-radius: 14px;
    padding: 0.9rem 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    min-height: 96px;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .message-card.high {
    border-color: #ff5d6c;
    background: linear-gradient(180deg, #1f0a10 0%, #11141b 100%);
    box-shadow: 0 0 24px rgba(255, 93, 108, 0.18);
  }

  .message-card.medium {
    border-color: #f5b86a;
    background: linear-gradient(180deg, #1a140a 0%, #11141b 100%);
  }

  .message-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.25rem 0.55rem;
    border-radius: 999px;
    background: #1c2230;
    color: #8b91a1;
  }

  .badge.dot::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge.high { background: #391218; color: #ff8a96; }
  .badge.medium { background: #2a1f0c; color: #ffc185; }
  .badge.low { background: #15202b; color: #6fb8ff; }

  .badge.event-warning { background: #391218; color: #ff8a96; }
  .badge.event-speech { background: #11243b; color: #6fb8ff; }
  .badge.event-background { background: #1a1f2b; color: #8b91a1; }

  .badge.directed { background: #0e2a23; color: #4ee6b8; }

  .message {
    font-size: 1.1rem;
    line-height: 1.35;
    font-weight: 500;
  }

  .transcript {
    font-size: 0.85rem;
    color: #a0a6b3;
    font-style: italic;
    min-height: 1.1em;
  }

  .transcript.empty {
    color: #4a4f5a;
    font-style: normal;
  }

  #status {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    color: #555b66;
    text-transform: uppercase;
  }

  #status.connected {
    color: #4ee6b8;
  }
</style>
</head>

<body>
  <main class="hud">
    <div class="title">Sound Direction</div>

    <canvas id="direction-canvas" width="320" height="320"></canvas>

    <div class="direction-label" id="direction-label">Listening...</div>
    <div class="angle" id="angle-display">--°</div>

    <div class="message-card" id="message-card">
      <div class="message-row">
        <span class="badge dot low" id="importance-badge">idle</span>
        <span class="badge" id="event-badge" hidden></span>
        <span class="badge directed" id="directed-badge" hidden>at you</span>
      </div>
      <div class="message" id="message">Waiting for sound...</div>
      <div class="transcript empty" id="transcript">no transcript yet</div>
    </div>

    <div id="status">Connecting...</div>
  </main>

<script>
  const canvas = document.getElementById("direction-canvas");
  const ctx = canvas.getContext("2d");

  const directionLabel = document.getElementById("direction-label");
  const angleDisplay = document.getElementById("angle-display");
  const status = document.getElementById("status");

  const messageCard = document.getElementById("message-card");
  const messageEl = document.getElementById("message");
  const transcriptEl = document.getElementById("transcript");
  const importanceBadge = document.getElementById("importance-badge");
  const eventBadge = document.getElementById("event-badge");
  const directedBadge = document.getElementById("directed-badge");

  const cx = 160;
  const cy = 160;
  const radius = 118;

  let currentAngle = 0;
  let targetAngle = 0;
  let importance = "low";

  const importanceColors = {
    low: "rgba(78, 230, 184, 0.85)",
    medium: "rgba(245, 184, 106, 0.95)",
    high: "rgba(255, 93, 108, 0.95)"
  };

  const importanceGlow = {
    low: "rgba(78, 230, 184, 0.08)",
    medium: "rgba(245, 184, 106, 0.12)",
    high: "rgba(255, 93, 108, 0.18)"
  };

  function normalizeAngle(angle) {
    return ((angle % 360) + 360) % 360;
  }

  function toSignedAngle(angle) {
    const normalized = normalizeAngle(angle);
    return normalized > 180 ? normalized - 360 : normalized;
  }

  function getDirectionText(angle) {
    const a = normalizeAngle(angle);

    if (a >= 337.5 || a < 22.5) return "In Front";
    if (a < 67.5) return "Front Right";
    if (a < 112.5) return "Right";
    if (a < 157.5) return "Back Right";
    if (a < 202.5) return "Behind";
    if (a < 247.5) return "Back Left";
    if (a < 292.5) return "Left";
    return "Front Left";
  }

  function drawHUD(angle) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const rad = (angle - 90) * Math.PI / 180;
    const dotX = cx + Math.cos(rad) * radius;
    const dotY = cy + Math.sin(rad) * radius;

    const accent = importanceColors[importance] || importanceColors.low;
    const glowColor = importanceGlow[importance] || importanceGlow.low;

    // Soft outer glow
    const glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 150);
    glow.addColorStop(0, glowColor);
    glow.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, 150, 0, Math.PI * 2);
    ctx.fill();

    // Main ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#252936";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Subtle front/right/back/left marks
    const marks = [
      { label: "FRONT", angle: 0 },
      { label: "RIGHT", angle: 90 },
      { label: "BACK", angle: 180 },
      { label: "LEFT", angle: 270 }
    ];

    marks.forEach(mark => {
      const markRad = (mark.angle - 90) * Math.PI / 180;
      const x = cx + Math.cos(markRad) * (radius + 26);
      const y = cy + Math.sin(markRad) * (radius + 26);

      ctx.fillStyle = mark.angle === 0 ? "#d8fff4" : "#5d6472";
      ctx.font = "600 11px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(mark.label, x, y);
    });

    // Center user marker
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.fillStyle = "#151923";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#e8fff8";
    ctx.fill();

    // Direction line
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(dotX, dotY);
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();

    // Source dot
    ctx.beginPath();
    ctx.arc(dotX, dotY, 10, 0, Math.PI * 2);
    ctx.fillStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Small front-facing notch
    ctx.beginPath();
    ctx.moveTo(cx, cy - 34);
    ctx.lineTo(cx - 7, cy - 22);
    ctx.lineTo(cx + 7, cy - 22);
    ctx.closePath();
    ctx.fillStyle = "#d8fff4";
    ctx.fill();
  }

  function animate() {
    let diff = targetAngle - currentAngle;

    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    currentAngle += diff * 0.14;

    drawHUD(currentAngle);
    requestAnimationFrame(animate);
  }

  drawHUD(0);
  animate();

  function setImportance(level) {
    importance = ["low", "medium", "high"].includes(level) ? level : "low";

    document.body.classList.remove("high", "medium");
    if (importance !== "low") {
      document.body.classList.add(importance);
    }

    messageCard.classList.remove("high", "medium");
    if (importance !== "low") {
      messageCard.classList.add(importance);
    }

    importanceBadge.classList.remove("high", "medium", "low");
    importanceBadge.classList.add(importance);
    importanceBadge.textContent = importance;
  }

  function setEventType(eventType) {
    eventBadge.classList.remove("event-speech", "event-warning", "event-background");

    if (!eventType || eventType === "unknown") {
      eventBadge.hidden = true;
      return;
    }

    eventBadge.hidden = false;
    eventBadge.classList.add(`event-${eventType}`);
    eventBadge.textContent = eventType;
  }

  function setDirected(directed) {
    directedBadge.hidden = !directed;
  }

  function setTranscript(text) {
    if (text && text.trim()) {
      transcriptEl.textContent = `"${text}"`;
      transcriptEl.classList.remove("empty");
    } else {
      transcriptEl.textContent = "no transcript yet";
      transcriptEl.classList.add("empty");
    }
  }

  const PI_IP = window.location.hostname || "localhost";
  const ws = new WebSocket(`ws://${PI_IP}:8765`);

  ws.onopen = () => {
    status.textContent = "Connected";
    status.className = "connected";
  };

  ws.onmessage = event => {
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (err) {
      console.warn("Bad JSON from server:", event.data);
      return;
    }

    if (typeof data.angle !== "number") return;

    // Smooth-rotate to the new direction
    targetAngle = normalizeAngle(data.angle);

    const signed = toSignedAngle(targetAngle);
    const side = signed === 0 ? "" : signed > 0 ? " right" : " left";

    directionLabel.textContent = getDirectionText(targetAngle);
    angleDisplay.textContent = `${Math.abs(signed).toFixed(0)}°${side}`;

    const stage = data.stage || "directional";

    // On the immediate directional alert, reset transcript/message so the
    // user gets a clean "we just heard SOMETHING" state instead of stale text.
    if (stage === "directional") {
      setImportance("low");
      setEventType(null);
      setDirected(false);
      setTranscript("");
      messageEl.textContent = data.message || "Sound detected";
      return;
    }

    // Stages "transcribed" and "final" carry full reasoning fields.
    setImportance(data.importance);
    setEventType(data.event_type);
    setDirected(!!data.directed_at_user);
    setTranscript(data.transcript);
    messageEl.textContent = data.message || "Sound detected";
  };

  ws.onclose = () => {
    status.textContent = "Disconnected";
    status.className = "";
  };
</script>
</body>
</html>
