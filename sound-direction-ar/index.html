<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Sound AR</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; width:100vw; height:100vh; }
    #video { position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:1; }
    #overlay { position:fixed; top:0; left:0; width:100%; height:100%; z-index:2; pointer-events:none; }
    #ui {
      position:fixed; top:50%; left:50%;
      transform:translate(-50%,-50%);
      z-index:10; text-align:center;
      font-family:-apple-system,monospace; color:#fff;
    }
    #ui button {
      background:rgba(255,255,255,0.1);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border:1.5px solid rgba(255,255,255,0.4);
      color:#fff; font-size:18px;
      padding:18px 40px; border-radius:50px;
      cursor:pointer; letter-spacing:3px;
    }
    #ui p { margin-top:14px; font-size:13px; opacity:0.5; }
  </style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="overlay"></canvas>
<div id="ui">
  <button id="btn">TAP TO START CAMERA</button>
  <p id="msg">tap to enable camera</p>
</div>
<script>
const video = document.getElementById("video");
const canvas = document.getElementById("overlay");
const ctx = canvas.getContext("2d");
const ui = document.getElementById("ui");
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

const DIR_DEG = {"front":0,"front-right":45,"right":90,"back-right":135,"back":180,"back-left":225,"left":270,"front-left":315};

function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
resize(); window.addEventListener("resize", resize);

btn.addEventListener("click", () => {
  msg.textContent = "requesting camera...";
  btn.disabled = true;
  navigator.mediaDevices.getUserMedia({ video:{facingMode:{ideal:"environment"}}, audio:false })
    .then(stream => {
      video.srcObject = stream;
      ui.style.display = "none";
    })
    .catch(err => {
      btn.disabled = false;
      msg.textContent = "ERROR: " + err.name + " — " + err.message;
      msg.style.color = "#ff4444";
      btn.textContent = "RETRY";
    });
});

let state = {direction:"front", volume:0, danger:false};
let smoothDeg=0, smoothVol=0;

async function poll() {
  try { const r=await fetch("/state"); if(r.ok) state=await r.json(); } catch(_) {}
}
setInterval(poll, 80);

function lerpAngle(a,b,t) {
  let d=b-a; if(d>180)d-=360; if(d<-180)d+=360; return a+d*t;
}

const particles=[];
function spawnFire(cx,cy,R,dirRad,danger) {
  const a=dirRad+(Math.random()-0.5)*0.9;
  const r=R*(0.7+Math.random()*0.4);
  particles.push({
    x:cx+Math.cos(a)*r, y:cy+Math.sin(a)*r,
    vx:Math.cos(a)*0.8, vy:Math.sin(a)*0.8-0.5,
    life:1, decay:0.02+Math.random()*0.02,
    size:3+Math.random()*5, danger
  });
}

let tick=0;
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  tick++;
  const W=canvas.width,H=canvas.height,cx=W/2,cy=H/2,base=Math.min(W,H);
  const R=base*0.25, rIn=R*0.62, SEGS=8, GAP=0.07;

  const rawVol=Math.min(state.volume||0,100);
  const danger=!!state.danger;
  const isLoud=rawVol>=55;
  const isActive=rawVol>4;

  smoothVol+=( rawVol-smoothVol)*0.15;
  const targetDeg=DIR_DEG[state.direction]??0;
  smoothDeg=lerpAngle(smoothDeg,targetDeg,0.12);
  const activeIdx=Math.round(smoothDeg/45)%SEGS;
  const dirRad=(smoothDeg-90)*Math.PI/180;
  const volN=smoothVol/100;

  if(isLoud && tick%2===0) for(let i=0;i<3;i++) spawnFire(cx,cy,R,dirRad,danger);
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay;
    if(p.life<=0) particles.splice(i,1);
  }

  // 8 sectors
  for(let i=0;i<SEGS;i++) {
    const dist=Math.min(Math.abs(i-activeIdx),SEGS-Math.abs(i-activeIdx));
    const isThis=i===activeIdx, isNeigh=dist===1;
    const a1=(i/SEGS)*Math.PI*2-Math.PI/2+GAP;
    const a2=((i+1)/SEGS)*Math.PI*2-Math.PI/2-GAP;

    ctx.beginPath();
    ctx.arc(cx,cy,R,a1,a2); ctx.arc(cx,cy,rIn,a2,a1,true); ctx.closePath();

    if(isThis && isActive) {
      const pulse=0.75+0.25*Math.sin(tick*0.18);
      if(isLoud) {
        ctx.fillStyle=danger?`rgba(255,40,0,${0.55*pulse})`:`rgba(255,140,0,${0.5*pulse})`;
        ctx.shadowColor=danger?"#FF2200":"#FF8800"; ctx.shadowBlur=38*pulse;
      } else {
        ctx.fillStyle=`rgba(150,205,255,${0.3*pulse})`;
        ctx.shadowColor="#60AAFF"; ctx.shadowBlur=24*pulse;
      }
    } else if(isNeigh && isActive) {
      ctx.fillStyle=isLoud?"rgba(255,100,0,0.09)":"rgba(130,185,255,0.09)";
      ctx.shadowBlur=0;
    } else {
      ctx.fillStyle="rgba(255,255,255,0.022)"; ctx.shadowBlur=0;
    }
    ctx.fill(); ctx.shadowBlur=0;

    ctx.strokeStyle=(isThis&&isActive)
      ?(isLoud?"rgba(255,150,0,0.8)":"rgba(150,205,255,0.6)")
      :"rgba(255,255,255,0.05)";
    ctx.lineWidth=(isThis&&isActive)?1.8:0.8;
    ctx.stroke();
  }

  // outer ring
  ctx.beginPath(); ctx.arc(cx,cy,R+4,0,Math.PI*2);
  ctx.strokeStyle=isActive?(isLoud?"rgba(255,130,0,0.4)":"rgba(150,205,255,0.28)"):"rgba(255,255,255,0.05)";
  ctx.lineWidth=1.5; ctx.stroke();

  // inner ring
  ctx.beginPath(); ctx.arc(cx,cy,rIn-4,0,Math.PI*2);
  ctx.strokeStyle="rgba(255,255,255,0.05)"; ctx.lineWidth=1; ctx.stroke();

  // footstep icon
  if(isActive && !isLoud) {
    const fx=cx+Math.cos(dirRad)*(R*1.18), fy=cy+Math.sin(dirRad)*(R*1.18);
    ctx.save(); ctx.translate(fx,fy); ctx.rotate(dirRad+Math.PI/2);
    ctx.font=`${base*0.055}px serif`; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.globalAlpha=Math.min(volN*2.5,0.95); ctx.fillText("👣",0,0);
    ctx.globalAlpha=1; ctx.restore();
  }

  // fire particles
  particles.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
    const a=p.life*0.9;
    ctx.fillStyle=p.danger?`rgba(255,60,0,${a})`:`rgba(255,160,0,${a})`;
    ctx.shadowColor=p.danger?"#FF2200":"#FF8800"; ctx.shadowBlur=10;
    ctx.fill();
  }); ctx.shadowBlur=0;

  // tick marks
  for(let i=0;i<SEGS;i++) {
    const a=(i/SEGS)*Math.PI*2-Math.PI/2;
    const near=i===activeIdx&&isActive;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(R+6),cy+Math.sin(a)*(R+6));
    ctx.lineTo(cx+Math.cos(a)*(R+(near?22:12)),cy+Math.sin(a)*(R+(near?22:12)));
    ctx.strokeStyle=near?(isLoud?"rgba(255,160,0,0.9)":"rgba(170,215,255,0.75)"):"rgba(255,255,255,0.12)";
    ctx.lineWidth=near?2.5:1; ctx.stroke();
  }

  // label
  ctx.textAlign="center";
  if(isActive) {
    const lbl=isLoud?(danger?"⚠ DANGER":"🔥 LOUD"):"↑ "+(state.direction||"").toUpperCase().replace(/-/g," ");
    ctx.font=`bold ${base*0.027}px -apple-system,monospace`;
    ctx.fillStyle=isLoud?`rgba(255,155,0,${0.85+0.15*Math.sin(tick*0.2)})`:"rgba(170,215,255,0.9)";
    ctx.shadowColor=isLoud?"#FF8800":"#60AAFF"; ctx.shadowBlur=16;
    ctx.fillText(lbl,cx,cy-R-24); ctx.shadowBlur=0;
  } else {
    ctx.font=`${base*0.017}px monospace`;
    ctx.fillStyle="rgba(255,255,255,0.15)";
    ctx.fillText("LISTENING",cx,cy-R-24);
  }

  // volume bar
  if(isActive) {
    const bw=base*0.32,bh=4,bx=cx-bw/2,by=cy+R+30;
    ctx.fillStyle="rgba(255,255,255,0.07)";
    ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,2); ctx.fill();
    const col=isLoud?"#FF9900":"#60AAFF";
    ctx.fillStyle=col; ctx.shadowColor=col; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.roundRect(bx,by,bw*volN,bh,2); ctx.fill();
    ctx.shadowBlur=0;
  }

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
