<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sound Direction</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: #08090c;
    color: white;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hud {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.25rem;
  }

  .title {
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    color: #7b7f8c;
    text-transform: uppercase;
  }

  #direction-canvas {
    width: 320px;
    height: 320px;
  }

  .direction-label {
    font-size: 2.2rem;
    font-weight: 600;
    letter-spacing: -0.03em;
  }

  .angle {
    color: #8b91a1;
    font-size: 1rem;
  }

  #status {
    font-size: 0.75rem;
    letter-spacing: 0.14em;
    color: #555b66;
    text-transform: uppercase;
  }

  #status.connected {
    color: #4ee6b8;
  }
</style>
</head>

<body>
  <main class="hud">
    <div class="title">Sound Direction</div>

    <canvas id="direction-canvas" width="320" height="320"></canvas>

    <div class="direction-label" id="direction-label">Listening...</div>
    <div class="angle" id="angle-display">--°</div>

    <div id="status">Connecting...</div>
  </main>

<script>
  const canvas = document.getElementById("direction-canvas");
  const ctx = canvas.getContext("2d");

  const directionLabel = document.getElementById("direction-label");
  const angleDisplay = document.getElementById("angle-display");
  const status = document.getElementById("status");

  const cx = 160;
  const cy = 160;
  const radius = 118;

  let currentAngle = 0;
  let targetAngle = 0;

  function normalizeAngle(angle) {
    return ((angle % 360) + 360) % 360;
  }

  function toSignedAngle(angle) {
    const normalized = normalizeAngle(angle);
    return normalized > 180 ? normalized - 360 : normalized;
  }

  function getDirectionText(angle) {
    const a = normalizeAngle(angle);

    if (a >= 337.5 || a < 22.5) return "In Front";
    if (a < 67.5) return "Front Right";
    if (a < 112.5) return "Right";
    if (a < 157.5) return "Back Right";
    if (a < 202.5) return "Behind";
    if (a < 247.5) return "Back Left";
    if (a < 292.5) return "Left";
    return "Front Left";
  }

  function drawHUD(angle) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const rad = (angle - 90) * Math.PI / 180;
    const dotX = cx + Math.cos(rad) * radius;
    const dotY = cy + Math.sin(rad) * radius;

    // Soft outer glow
    const glow = ctx.createRadialGradient(cx, cy, 20, cx, cy, 150);
    glow.addColorStop(0, "rgba(78, 230, 184, 0.08)");
    glow.addColorStop(1, "rgba(78, 230, 184, 0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, 150, 0, Math.PI * 2);
    ctx.fill();

    // Main ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = "#252936";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Subtle front/right/back/left marks
    const marks = [
      { label: "FRONT", angle: 0 },
      { label: "RIGHT", angle: 90 },
      { label: "BACK", angle: 180 },
      { label: "LEFT", angle: 270 }
    ];

    marks.forEach(mark => {
      const markRad = (mark.angle - 90) * Math.PI / 180;
      const x = cx + Math.cos(markRad) * (radius + 26);
      const y = cy + Math.sin(markRad) * (radius + 26);

      ctx.fillStyle = mark.angle === 0 ? "#d8fff4" : "#5d6472";
      ctx.font = "600 11px Inter, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(mark.label, x, y);
    });

    // Center user marker
    ctx.beginPath();
    ctx.arc(cx, cy, 18, 0, Math.PI * 2);
    ctx.fillStyle = "#151923";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fillStyle = "#e8fff8";
    ctx.fill();

    // Direction line
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(dotX, dotY);
    ctx.strokeStyle = "rgba(78, 230, 184, 0.85)";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.stroke();

    // Source dot
    ctx.beginPath();
    ctx.arc(dotX, dotY, 10, 0, Math.PI * 2);
    ctx.fillStyle = "#4ee6b8";
    ctx.shadowColor = "#4ee6b8";
    ctx.shadowBlur = 18;
    ctx.fill();
    ctx.shadowBlur = 0;

    // Small front-facing notch
    ctx.beginPath();
    ctx.moveTo(cx, cy - 34);
    ctx.lineTo(cx - 7, cy - 22);
    ctx.lineTo(cx + 7, cy - 22);
    ctx.closePath();
    ctx.fillStyle = "#d8fff4";
    ctx.fill();
  }

  function animate() {
    let diff = targetAngle - currentAngle;

    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    currentAngle += diff * 0.14;

    drawHUD(currentAngle);
    requestAnimationFrame(animate);
  }

  drawHUD(0);
  animate();

  const PI_IP = window.location.hostname;
  const ws = new WebSocket(`ws://${PI_IP}:8765`);

  ws.onopen = () => {
    status.textContent = "Connected";
    status.className = "connected";
  };

  ws.onmessage = event => {
    const data = JSON.parse(event.data);

    // Assumes data.angle is relative to the user's head:
    // 0 = front, 90 = right, 180 = behind, 270 = left
    targetAngle = normalizeAngle(data.angle);

    const signed = toSignedAngle(targetAngle);
    const side = signed === 0 ? "" : signed > 0 ? " right" : " left";

    directionLabel.textContent = getDirectionText(targetAngle);
    angleDisplay.textContent = `${Math.abs(signed).toFixed(0)}°${side}`;
  };

  ws.onclose = () => {
    status.textContent = "Disconnected";
    status.className = "";
  };
</script>
</body>
</html>
